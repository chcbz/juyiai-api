dependencies {
    api project(':economy:jia-economy-api')
    implementation project(':economy:jia-economy-mapper')
    implementation project(':common:jia-common-service')
    compileOnly libs.spring.security.oauth2.resource.server
    compileOnly libs.spring.security.oauth2.jose
    testImplementation project(':common:jia-common-test')
    testImplementation libs.spring.security.oauth2.resource.server
    testImplementation libs.spring.security.oauth2.jose
    testImplementation libs.spring.security.config
    testImplementation 'org.springframework.security:spring-security-web'
    testImplementation 'org.apache.tomcat.embed:tomcat-embed-core'
    testRuntimeOnly libs.mysql
}

version = '1.1.2-SNAPSHOT'
description = 'jia-economy-service'


// Economy hosting configuration/schema slice. It is isolated from historical
// default-test compilation debt and keeps the real MySQL fixture opt-in through
// CYF_ECO_MYSQL_URL; without that environment variable only the no-DB contract runs.
def economyHostingRegressionSourceSet = sourceSets.create('economyHostingRegression') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/economy/config/EconomyPreviewConfigurationTest.java'
        include 'cn/jia/economy/config/EconomyHostingRentSchemaInitializerMySqlTest.java'
        include 'cn/jia/economy/config/EconomyMySqlTestFixture.java'
        include 'cn/jia/economy/service/impl/HostingRentLedgerServiceRealTransactionTest.java'
        include 'cn/jia/economy/service/impl/HostingRentControlImportTest.java'
        include 'cn/jia/economy/service/impl/EconomyPostingServiceRealTransactionTest.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(economyHostingRegressionSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(economyHostingRegressionSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}
tasks.register('economyHostingRegression', Test) {
    maxParallelForks = 1
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=160m', '-Xss256k'
    group = 'verification'
    description = 'Runs isolated economy hosting preview and opt-in MySQL schema regressions.'
    dependsOn tasks.named(economyHostingRegressionSourceSet.classesTaskName)
    testClassesDirs = economyHostingRegressionSourceSet.output.classesDirs
    classpath = economyHostingRegressionSourceSet.runtimeClasspath
    useJUnitPlatform()
}

// Real HTTP fixtures use the same Servlet/Spring versions as the application artifact.
gradle.projectsEvaluated {
    def applicationRuntime = project(':starter').configurations.runtimeClasspath
    configurations.testCompileClasspath.shouldResolveConsistentlyWith(applicationRuntime)
    configurations.testRuntimeClasspath.shouldResolveConsistentlyWith(applicationRuntime)
}

// Actual MySQL usage journal regression, independent of unrelated HTTP fixture compilation.
def usageCostRegressionSourceSet = sourceSets.create('usageCostRegression') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/economy/config/EconomyMySqlTestFixture.java'
        include 'cn/jia/economy/service/impl/UsageCostServiceMySqlTest.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(usageCostRegressionSourceSet.implementationConfigurationName) {
    extendsFrom configurations.testImplementation
}
configurations.named(usageCostRegressionSourceSet.runtimeOnlyConfigurationName) {
    extendsFrom configurations.testRuntimeOnly
}
tasks.register('usageCostRegression', Test) {
    maxParallelForks = 1
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=160m', '-Xss256k'
    group = 'verification'
    description = 'Runs the opt-in real MySQL usage cost journal regressions.'
    dependsOn tasks.named(usageCostRegressionSourceSet.classesTaskName)
    testClassesDirs = usageCostRegressionSourceSet.output.classesDirs
    classpath = usageCostRegressionSourceSet.runtimeClasspath
    useJUnitPlatform()
}

// Database task quotes: compile only affected contracts and real database fixtures.
def taskQuoteRegressionSourceSet = sourceSets.create('taskQuoteRegression') {
    java {
        srcDir 'src/test/java'
        include 'cn/jia/economy/config/EconomyMySqlTestFixture.java'
        include 'cn/jia/economy/config/TaskPricingTestFixture.java'
        include 'cn/jia/economy/service/impl/DatabaseTaskPricingServiceTest.java'
        include 'cn/jia/economy/service/impl/DatabaseTaskPricingMySqlTest.java'
        include 'cn/jia/economy/service/impl/TaskBillingServiceMySqlTest.java'
        include 'cn/jia/economy/service/impl/EconomyWalletHttpMySqlTest.java'
        include 'cn/jia/economy/service/impl/UsageCostServiceMySqlTest.java'
    }
    resources.srcDir 'src/test/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += output + compileClasspath
}
configurations.named(taskQuoteRegressionSourceSet.implementationConfigurationName) { extendsFrom configurations.testImplementation }
configurations.named(taskQuoteRegressionSourceSet.runtimeOnlyConfigurationName) { extendsFrom configurations.testRuntimeOnly }
// Align Spring/Servlet dependencies locally using the application's Boot version.
// Resolving starter's configuration from this project's parallel task is unsafe.
dependencies {
    add(taskQuoteRegressionSourceSet.implementationConfigurationName,
        platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.asProvider().get()}"))
}
configurations.named(taskQuoteRegressionSourceSet.compileOnlyConfigurationName) { extendsFrom configurations.testCompileOnly }
configurations.named(taskQuoteRegressionSourceSet.annotationProcessorConfigurationName) { extendsFrom configurations.testAnnotationProcessor }
tasks.register('taskQuoteRegression', Test) {
    group = 'verification'
    description = 'Runs database pricing, immutable quote and precise cost snapshot regressions.'
    dependsOn tasks.named(taskQuoteRegressionSourceSet.classesTaskName)
    testClassesDirs = taskQuoteRegressionSourceSet.output.classesDirs
    classpath = taskQuoteRegressionSourceSet.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    maxHeapSize = '256m'
    jvmArgs '-XX:MaxMetaspaceSize=160m', '-Xss256k'
}
