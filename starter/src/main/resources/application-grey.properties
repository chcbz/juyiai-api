spring.ai.deepseek.chat.options.model=deepseek-chat

# OpenAI-compatible configuration
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.base-url=https://codex.chcbz.net/v1
spring.ai.openai.chat.model=deepseek-v4-pro
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.embedding.dimensions=1024

# Enable Ollama configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:0.6b
